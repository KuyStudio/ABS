
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rencana Produksi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:radial-gradient(circle at top left,#292929,transparent 45%),linear-gradient(135deg,#111,#1c1c1c,#262626)}
.container{width:100%;max-width:480px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:35px 25px;box-shadow:0 25px 60px rgba(0,0,0,.35);animation:appear .7s cubic-bezier(.22,1,.36,1)}
h1{text-align:center;color:white;font-size:25px;font-weight:700;letter-spacing:.5px;margin-bottom:28px}
label{display:block;color:#fdba74;font-size:14px;font-weight:600;margin-bottom:8px}
input[type="text"],input[type="number"]{width:100%;padding:14px;margin-bottom:20px;background:rgba(255,255,255,.05);border:1px solid rgba(253,186,116,.35);border-radius:12px;color:white;font-size:15px;outline:none;transition:border .3s}
input:focus{border-color:#fdba74}
input::placeholder{color:rgba(255,255,255,.35)}
.checkbox-label{display:flex;align-items:center;gap:10px;margin:0 0 20px;padding:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px}
.checkbox-label label{display:flex;align-items:center;gap:8px;margin:0;white-space:nowrap;cursor:pointer}
.checkbox-label input[type="checkbox"]{width:17px;height:17px;accent-color:#fdba74}
#masterbet{flex:1;min-width:0;width:100%;margin:0;padding:10px}
.checkbox-label span{color:#fdba74;font-size:14px}
button{width:100%;padding:15px;background:#fdba74;color:#171717;font-size:15px;font-weight:700;border:none;border-radius:12px;cursor:pointer;transition:all .3s}
button:hover{background:#fbad58;transform:translateY(-2px);box-shadow:0 10px 25px rgba(253,186,116,.15)}
button:active{transform:scale(.97)}
#hasil{display:none;margin-top:22px;padding:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:15px}
#hasil p{color:rgba(255,255,255,.75);font-size:14px;line-height:1.7;margin:8px 0;overflow-wrap:anywhere}
#hasil strong{color:#fdba74}
@keyframes appear{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:480px){.container{padding:30px 20px}h1{font-size:22px}}
</style>
</head>
<body>
<div class="container">
<h1>RENCANA PRODUKSI</h1>
<label for="jumlahPO">Jumlah PO (pcs):</label>
<input type="text" id="jumlahPO" oninput="formatAngka(this)" placeholder="Masukkan jumlah PO" required>
<label for="beratPerPcs">Berat per PCS (gram):</label>
<input type="number" id="beratPerPcs" step="any" placeholder="Masukkan berat per pcs" required>
<label for="waktuPerPcs">Cycle Time (detik):</label>
<input type="number" id="waktuPerPcs" step="any" placeholder="Masukkan cycle time" required>
<label for="cvt">CVT:</label>
<input type="number" id="cvt" step="any" placeholder="Masukkan CVT" required>
<div class="checkbox-label">
<label for="gunakanMasterbet"><input type="checkbox" id="gunakanMasterbet" onchange="document.getElementById('masterbet').disabled=!this.checked">Gunakan Masterbet</label>
<input type="text" id="masterbet" oninput="formatAngka(this)" placeholder="0" disabled>
<span>%</span>
</div>
<button onclick="hitung()">Hitung</button>
<div id="hasil"></div>
</div>
<script>
function formatAngka(input){
let angka=input.value.replace(/\D/g,'');
input.value=angka.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}
function hitung(){
const jumlahPO=parseFloat(document.getElementById('jumlahPO').value.replace(/\./g,''))||0;
const beratPerPcs=parseFloat(document.getElementById('beratPerPcs').value)||0;
const waktuPerPcs=parseFloat(document.getElementById('waktuPerPcs').value)||0;
const cvt=parseFloat(document.getElementById('cvt').value)||0;
const gunakanMasterbet=document.getElementById('gunakanMasterbet').checked;
const masterbet=parseFloat(document.getElementById('masterbet').value.replace(/\./g,''))||0;
if(jumlahPO<=0||beratPerPcs<=0||waktuPerPcs<=0||cvt<=0){
alert("Mohon masukkan semua nilai dengan benar.");
return;
}
const totalBeratGram=jumlahPO*beratPerPcs;
const totalBeratKg=Math.floor(totalBeratGram/1000);
const totalWaktuDetik=(jumlahPO*waktuPerPcs)/cvt;
const waktuDalamJam=totalWaktuDetik/3600;
const shiftJam=12;
const pcsPerShift=Math.floor((shiftJam*3600*cvt)/waktuPerPcs);
const shiftDiperlukan=Math.ceil(jumlahPO/pcsPerShift);
const shiftPerHari=2;
const hariDiperlukan=Math.ceil(shiftDiperlukan/shiftPerHari);
let totalMasterbet=0;
if(gunakanMasterbet){
totalMasterbet=(totalBeratGram*masterbet)/100;
}
const totalMasterbetKg=Math.floor(totalMasterbet/1000);
const formatHasil=angka=>angka.toLocaleString('id-ID');
const hasil=document.getElementById('hasil');
hasil.style.display="block";
hasil.innerHTML=`
<p>Total Berat: <strong>${formatHasil(totalBeratKg)} kg</strong></p>
<p>Total Waktu: <strong>${waktuDalamJam.toFixed(2)} jam</strong></p>
<p>Jumlah PCS dalam satu shift (12 jam): <strong>${formatHasil(pcsPerShift)} pcs</strong></p>
<p>Shift yang diperlukan untuk menyelesaikan PO: <strong>${formatHasil(shiftDiperlukan)} shift</strong></p>
<p>Hari yang diperlukan untuk menyelesaikan PO: <strong>${formatHasil(hariDiperlukan)} hari</strong></p>
${gunakanMasterbet?`<p>Total Masterbet: <strong>${formatHasil(totalMasterbetKg)} kg</strong></p>`:''}
`;
}
</script>
</body>
</html>
