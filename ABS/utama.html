
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Menu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:radial-gradient(circle at top left,#292929,transparent 45%),linear-gradient(135deg,#111,#1c1c1c,#262626)}
.container{width:100%;max-width:420px;text-align:center;background:rgba(255,255,255,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:35px 25px;box-shadow:0 25px 60px rgba(0,0,0,.35);animation:appear .7s cubic-bezier(.22,1,.36,1)}
h1{color:white;font-size:30px;font-weight:700;letter-spacing:.5px;margin-bottom:8px}
.desc{color:rgba(255,255,255,.55);font-size:14px;margin-bottom:25px}
.link-list{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:14px}
.btn{display:flex;justify-content:center;align-items:center;width:100%;padding:17px 15px;margin-bottom:12px;text-decoration:none;color:white;background:rgba(255,255,255,.05);border:1px solid rgba(253,186,116,.55);border-radius:14px;font-weight:600;font-size:15px;letter-spacing:.5px;transition:all .3s ease}
.btn:last-child{margin-bottom:0}
.btn:hover{transform:translateY(-3px);background:#fdba74;color:#171717;border-color:#fdba74;box-shadow:0 10px 25px rgba(253,186,116,.15)}
.btn:active{transform:scale(.97)}
@keyframes appear{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:480px){.container{padding:30px 20px}h1{font-size:27px}}
</style>
</head>
<body>
<div class="container">
<h1>Menu Utama</h1>
<p class="desc">Pilih menu yang ingin digunakan</p>
<div class="link-list">
<a class="btn" href="pages/rencana-produksi.html">RENCANA PRODUKSI</a>
<a class="btn" href="pages/material-ke-part.html">MATERIAL KE PART</a>
<a class="btn" href="pages/part-ke-material.html">PART KE MATERIAL</a>
<a class="btn" href="pages/stock-opname.html">STOCK OPNAME</a>
</div>
</div>
</body>
</html>
